<!DOCTYPE html>
<html lang="ko" data-lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
{% if page.canonical %}<link rel="canonical" href="{{ page.canonical }}">{% endif %}
<meta name="robots" content="index, follow">
<meta name="color-scheme" content="light">
<!--
  Language is resolved before first paint so the page never flashes the wrong
  one. Order: ?lang= override → the visitor's last choice → browser language.
  Anything that is not Korean falls back to English.
-->
<script>
(function () {
  try {
    var q = null;
    try { q = new URL(window.location.href).searchParams.get('lang'); } catch (e) {}
    var saved = null;
    try { saved = window.localStorage.getItem('kyro-legal-lang'); } catch (e) {}
    var nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
    var pick = q || saved || (/^ko\b/i.test(nav) ? 'ko' : 'en');
    if (pick !== 'ko' && pick !== 'en') pick = 'en';
    document.documentElement.setAttribute('data-lang', pick);
    document.documentElement.lang = pick;
  } catch (e) { /* no-JS and failure both leave the Korean default in place */ }
})();
</script>
<style>
  /* KYRO brand: ink #1B1B1B on #FAFAFA, lime #FFFF71 reserved for accents.
     Mirrors components/legal/legal.module.css on kyro.team so the two
     locations of this document look like the same document. */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #fafafa;
    color: #1b1b1b;
    -webkit-font-smoothing: antialiased;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Segoe UI", "Noto Sans KR", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    max-width: 820px; margin: 0 auto; padding: 24px 24px 0;
  }
  .wordmark {
    font-weight: 800; letter-spacing: .04em; font-size: 20px;
    color: #1b1b1b; text-decoration: none;
  }

  .langswitch { display: flex; border: 1px solid #d9d9d2; border-radius: 999px; overflow: hidden; }
  .langswitch button {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    font: inherit; font-size: 13px; line-height: 1; padding: 8px 14px;
    color: #1b1b1b; opacity: .55;
  }
  .langswitch button:hover { opacity: 1; }
  html[data-lang="ko"] .langswitch button[data-setlang="ko"],
  html[data-lang="en"] .langswitch button[data-setlang="en"] {
    background: #1b1b1b; color: #fafafa; opacity: 1; font-weight: 700;
  }

  /* Only the active language is rendered. */
  html[data-lang="ko"] [data-lang-section="en"],
  html[data-lang="en"] [data-lang-section="ko"] { display: none; }

  .prose {
    max-width: 820px; margin: 0 auto; padding: 32px 24px 96px;
    line-height: 1.75; font-size: 16px;
    word-break: keep-all; overflow-wrap: anywhere;
  }
  .prose h1 {
    font-size: 30px; font-weight: 800; line-height: 1.3;
    margin: 8px 0 28px; padding-bottom: 16px; border-bottom: 3px solid #ffff71;
  }
  .prose h2 { font-size: 22px; font-weight: 700; line-height: 1.35; margin: 44px 0 12px; scroll-margin-top: 24px; }
  .prose h3 { font-size: 18px; font-weight: 700; line-height: 1.4; margin: 32px 0 10px; scroll-margin-top: 24px; }
  .prose p { margin: 0 0 14px; }
  .prose strong { font-weight: 700; }
  .prose a { color: #1b1b1b; text-decoration: underline; text-decoration-color: #d8d800; text-underline-offset: 2px; }
  .prose a:hover { text-decoration-color: #1b1b1b; }
  .prose ul, .prose ol { margin: 0 0 16px; padding-left: 22px; }
  .prose li { margin: 4px 0; }
  .prose li > ul, .prose li > ol { margin: 4px 0; }
  .prose blockquote {
    margin: 18px 0; padding: 12px 18px;
    border-left: 4px solid #ffff71; background: #f3f3f0; border-radius: 0 8px 8px 0;
  }
  .prose blockquote p:last-child { margin-bottom: 0; }
  .prose hr { border: none; border-top: 1px solid #e2e2dd; margin: 40px 0; }
  .prose code { background: #ececec; padding: 1px 5px; border-radius: 4px; font-size: .9em; }

  /* Wide tables scroll inside their own box instead of widening the page. */
  .prose table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 460px; }
  .prose th, .prose td { border: 1px solid #e2e2dd; padding: 8px 12px; text-align: left; vertical-align: top; }
  .prose th { background: #f0f0ec; font-weight: 700; }
  .tablewrap { overflow-x: auto; margin: 0 0 18px; }

  @media (max-width: 600px) {
    .prose { font-size: 15px; padding: 24px 18px 80px; }
    .prose h1 { font-size: 25px; }
    .prose h2 { font-size: 19px; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <a class="wordmark" href="https://kyro.team">KYRO</a>
    {% if page.switcher %}
    <div class="langswitch" role="group" aria-label="Language / 언어">
      <button type="button" data-setlang="ko" lang="ko">한국어</button>
      <button type="button" data-setlang="en" lang="en">English</button>
    </div>
    {% endif %}
  </div>

  <article class="prose">{{ content }}</article>

<script>
(function () {
  var root = document.documentElement;

  function setLang(lang, remember) {
    if (lang !== 'ko' && lang !== 'en') return;
    root.setAttribute('data-lang', lang);
    root.lang = lang;
    if (remember) {
      try { window.localStorage.setItem('kyro-legal-lang', lang); } catch (e) {}
      try {
        var url = new URL(window.location.href);
        url.searchParams.set('lang', lang);
        window.history.replaceState(null, '', url.toString());
      } catch (e) {}
    }
  }

  // Switcher buttons.
  Array.prototype.forEach.call(document.querySelectorAll('[data-setlang]'), function (btn) {
    btn.addEventListener('click', function () { setLang(btn.getAttribute('data-setlang'), true); });
  });

  // The documents cross-link to each other as ./en.md and ./README.md so the
  // links also work when the markdown is read on GitHub. Here those are a
  // language switch, not a navigation.
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a) return;
    var href = a.getAttribute('href') || '';
    if (/(^|\/)en\.md$/.test(href)) { e.preventDefault(); setLang('en', true); window.scrollTo(0, 0); }
    else if (/(^|\/)README\.md$/.test(href)) { e.preventDefault(); setLang('ko', true); window.scrollTo(0, 0); }
  });

  // An anchor that lives in the hidden language (e.g. the Korean heading id
  // that garmin.html links to) would silently fail to scroll. Follow it.
  function followHash() {
    var id = decodeURIComponent((window.location.hash || '').slice(1));
    if (!id) return;
    var el = document.getElementById(id);
    if (!el) return;
    var section = el.closest ? el.closest('[data-lang-section]') : null;
    if (section) {
      var lang = section.getAttribute('data-lang-section');
      if (lang !== root.getAttribute('data-lang')) setLang(lang, false);
    }
    el.scrollIntoView();
  }
  window.addEventListener('hashchange', followHash);
  followHash();

  // Give every table its own horizontal scroll container.
  Array.prototype.forEach.call(document.querySelectorAll('.prose table'), function (t) {
    if (t.parentNode && t.parentNode.classList.contains('tablewrap')) return;
    var wrap = document.createElement('div');
    wrap.className = 'tablewrap';
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
  });
})();
</script>
</body>
</html>
